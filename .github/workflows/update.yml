name: Update internships

on:
  schedule:
    - cron: "0 */3 * * *"   # runs every 3 hours (UTC)
  workflow_dispatch:         # allows manual trigger from Actions tab

permissions:
  contents: write            # minimal scope required to commit data updates

concurrency:
  group: update-internships
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20      # hard timeout prevents hanging jobs from consuming quota
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the engine
        env:
          WORKDAY_PROXY: ${{ secrets.WORKDAY_PROXY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash"
        run: python run.py update

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/*.json data/*.csv data/*.jsonl \
                  docs/index.html docs/feed.xml docs/unsubscribe.html \
                  docs/radar.ics docs/trends-light.svg docs/trends-dark.svg \
                  docs/api/*.json
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: update internships ($(date -u +'%Y-%m-%d %H:%M UTC')) [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push contention, retrying ($attempt)..."; sleep 5
            done
          fi
